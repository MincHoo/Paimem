# mem-skill 配置模板
# 复制到 ~/.mem/mem.toml 后修改（python mem.py init 会自动生成一份）

[db]
path = "~/.mem/mem.db"

[model]
path = "~/.mem/models/e5-small-onnx"
backend = "onnx"          # 仅支持 onnx（无 torch 依赖）

[decay]
# 热度衰减半衰期（天）。调大=旧记忆留更久但噪音多；调小=更快沉底。
# 建议：项目周期 2 周调 14；长期个人助手调 180。不建议低于 7。
half_life_days = 35
# AI 自己写的记忆在衰减上再乘一次（防回音壁）。
# 0.33 会让自写记忆几乎检索不到，0.9 是实测折中。
self_factor = 0.9
# 低于此热度进冷区，不参与默认检索（--include-cold 可查）
cold_threshold = 0.15
# 被检索到时的复活分数
revive_score = 0.1

[write]
# 相似度超过此值视为重复，转为 reinforce 而不是新增。
# ⚠️ 必须按模型实测校准：e5-small 中文无关内容余弦就有 0.85–0.92，
#    同义改写可达 0.985。默认 0.96 只合并真正的近似重复。
dedup_sim = 0.96
# 单条记忆长度上限，超长应拆条
max_content_chars = 2000
# 开启后 verified=2 必须带 --reproduce
strict_evidence = false

[search]
default_k = 5
max_tokens = 1500

[graph]
# ⚠️ 换嵌入模型必须重测这四个阈值。
# e5-small 在中文上分布极压缩：无关内容 0.85-0.92，同义改写 0.985。
related = 0.88        # 建 related 边（还需共享标签，或 sim>=0.95）
neardup = 0.97        # 建 near_dup 边
contradicts = 0.94    # 判矛盾（配合否定词/数字冲突）
hop_gamma = 0.85      # 多跳逐跳衰减
top_k = 5             # 每节点保留几条边
contra_k = 5          # 每节点保留几条矛盾边
max_add = 20          # 单次检索最多扩展进多少条

[score]
# 四分量权重，会自动归一。改一项即可，不用手动配平。
w_content = 0.50
w_tags = 0.20
w_keyword = 0.15
w_graph = 0.15

[activation]
# 刚被检索过的记忆短期提权，然后快速回落。
# 作用：专注同一话题时，同一批记忆更容易反复出现。
boost = 0.15          # 最多 +15%
half_life_min = 30    # 30 分钟减半

[inject]
stable_k = 8          # 进 system 的长期记忆条数（缓存友好，贵在稳定）
dynamic_k = 3         # 进尾部的当前相关条数（每轮付费）
tail_item_chars = 180 # 尾部单条截断长度

[harvest]
# ⚠️ 2026-11-10 起废除后台路径：harvest 与 L2 enrich 不再自动触发。
# 下列参数仅在使用 `python mem.py harvest` 手动总结时有效。
max_per_session = 5   # 每个会话最多落几条
sim_skip = 0.90       # 与现有记忆相似度超过此值视为已覆盖
stale_min = 5         # 心跳超过这么多分钟没更新，视为僵死任务，下次 --drain 重跑

[segment]
# 段检索（域激活）打分权重：语义 vs 关键词覆盖
# 实测（segbench 23 题）：0.65/0.35 → Hit@1 52.2%；0.50/0.50 → 60.9%
w_sem = 0.50
w_kw = 0.50
# 段索引（工作记忆）。前台模式下由模型每轮调 mem_turn_close 写入。
drift_threshold = 0     # 0 = 关闭漂移检测（实测不可用：真实边界 0.862 vs 段内 0.827）
max_turns = 15          # 硬上限：段内最多多少轮
max_tokens = 12000      # 硬上限：段内最多多少 token

[llm]
# 仅手动 enrich / 不入默认路径时使用
endpoint = ""
model = ""
api_key = ""
timeout = 180

[quota]
max_writes_per_minute = 5
max_searches_per_minute = 20
max_daily_writes = 300

# ============ 端点白名单 ============
# 按「实际连接端点」登记，不按模型自报的名字。
#   large   -> 可写 verified<=1，active
#   medium  -> 可写 verified=0，active
#   small   -> 只能写 draft
#   unknown -> 只能写 draft（最保守）
#
# ⚠️ 配置即信任：防无意降级，不防恶意提权。
# ⚠️ 换模型不可感知：同一端口换了模型系统探测不到，请显式改这里。
# ⚠️ 自报不可信：origin_model 只做展示，不参与权限判定。
# ⚠️ 远程默认不可信：未登记的 http/https 一律按 draft 处理。

[[trust.endpoints]]
endpoint = "http://127.0.0.1:11434"
model_class = "unknown"
note = "本机 ollama，后端可能是任意规格模型"

[[trust.endpoints]]
endpoint = "http://127.0.0.1:8080"
model_class = "unknown"
note = "本机 llama.cpp server"
